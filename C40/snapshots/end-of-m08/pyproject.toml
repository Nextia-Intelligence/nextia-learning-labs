[project]
name = "larkfield-experiments"
version = "1.0.0"
description = "Larkfield's experiments: the simulator and the analysis tool of the Experiments and Causal Impact course"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[project.scripts]
sim = "larkfield_experiments.sim_cli:main"
xp = "larkfield_experiments.xp_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["larkfield_experiments*"]

[tool.setuptools.package-data]
larkfield_experiments = ["data/*.jsonl"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
