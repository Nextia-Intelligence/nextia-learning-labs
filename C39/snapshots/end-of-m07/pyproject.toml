[project]
name = "larkfield-match"
version = "1.0.0"
description = "Larkfield's record matching: the project of the Entity Resolution and Record Matching course"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[project.scripts]
match = "larkfield_match.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["larkfield_match*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
