[project]
name = "detect"
version = "1.0.0"
description = "A small scheduled detection job for Larkfield's card payments (course Anomaly Detection: Find What Is Unusual)"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
