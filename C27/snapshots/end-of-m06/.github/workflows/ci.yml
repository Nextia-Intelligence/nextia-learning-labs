# Checks before a merge or a release: lint, the tests (with PostgreSQL and pgvector), the
# held-out lock, the isolation checks and an evaluation smoke test on the recorded answers,
# then the image is built and started, and the smoke test runs against it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://assistant:ci-only-not-secret@127.0.0.1:5432/assistant
      TEST_DATABASE_URL: postgresql://assistant:ci-only-not-secret@127.0.0.1:5432/assistant_test
      ASSISTANT_TODAY: "2026-10-11"
      TORCH_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch first)
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: The held-out set has not changed
        run: python -m scripts.holdout check
      - name: Tests
        run: python -m pytest
      - name: Load the data pack (downloads the two models)
        run: python -m scripts.load_pack
      - name: Isolation checks (must be 0 leaks)
        run: python -m scripts.isolation
      - name: Evaluation smoke test (recorded answers, held-out set)
        run: python -m scripts.evaluate --set heldout --min-correct 0.75

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and start the demo
        run: |
          pip install "PyJWT[crypto]==2.15.1" "python-dotenv==1.2.4"
          cp .env.example .env
          sed -i 's/change-me-on-your-computer/ci-only-not-secret/g' .env
          python -m idp init
          APP_VERSION=${GITHUB_SHA::7} docker compose --profile app up -d --build --wait
          APP_VERSION=${GITHUB_SHA::7} docker compose --profile app run --rm api python -m scripts.load_pack
      - name: Smoke test
        run: SMOKE_TOKEN=$(python -m idp token usr-sam) python3 scripts/smoke.py http://127.0.0.1:8000
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 100
      - name: Stop
        if: always()
        run: docker compose --profile app down --volumes
