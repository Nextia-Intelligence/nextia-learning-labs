# A run made to overfit ON PURPOSE (Module 4, lesson 3): very little data, many epochs, a high learning
# rate and a larger rank. Watch the training loss fall to almost zero while the validation loss rises.
name = "overfit"
seed = 12
threads = 2
notes = "48 training records, 20 epochs, learning rate 1e-3, rank 16: made to overfit"

[data]
train = "data/prepared/train.jsonl"
train_limit = 48            # only the first 48 training records
val = "data/prepared/val.jsonl"
max_tokens = 320

[lora]
rank = 16
alpha = 32
dropout = 0.0
targets = ["q_proj", "v_proj"]

[train]
learning_rate = 1e-3
batch_size = 8
epochs = 20
eval_every = 6              # once per epoch (48 records / 8 = 6 steps)
checkpoint_every = 30
gradient_checkpointing = true
keep_checkpoints = 2
