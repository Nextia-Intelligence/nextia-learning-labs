<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larkfield search</title>
<style>
  :root { --bg: #fbfaf7; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e0d8; --accent: #2f6f5e; --warn: #9a3b1e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17181a; --ink: #ececec; --muted: #a0a0a6; --line: #34363a; --accent: #7cc4ad; --warn: #f0a07f; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .box { position: relative; }
  input { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
  ul.sug { position: absolute; left: 0; right: 0; margin: 2px 0 0; padding: 4px 0; list-style: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; z-index: 2; }
  ul.sug li { padding: 4px 12px; cursor: pointer; }
  ul.sug li:hover { background: var(--line); }
  .meta { color: var(--muted); font-size: 14px; margin: 10px 0; }
  .grid { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .facet h3 { font-size: 14px; margin: 12px 0 4px; }
  .facet div { font-size: 14px; color: var(--muted); }
  ol { padding-left: 22px; margin: 0; }
  li.r { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .t { font-weight: 600; }
  .s { color: var(--muted); font-size: 14px; }
  .tag { font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); margin-left: 6px; }
  .out { color: var(--warn); }
  .note { border-left: 3px solid var(--warn); padding: 6px 10px; margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Larkfield search</h1>
  <p class="meta">The course project's search page, on your computer. The catalogue is derived from WANDS; prices, stock and sale flags are synthetic.</p>
  <div class="box">
    <input id="q" autocomplete="off" placeholder="Search Larkfield, for example: grey outdoor cushion">
    <ul class="sug" id="sug" hidden></ul>
  </div>
  <p class="meta" id="meta"></p>
  <p class="note" id="note" hidden></p>
  <div class="grid">
    <aside id="facets"></aside>
    <ol id="results"></ol>
  </div>
</main>
<script>
const q = document.getElementById('q'), sug = document.getElementById('sug');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let timer;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (!q.value.trim()) { sug.hidden = true; return; }
    const r = await (await fetch('/api/suggest?q=' + encodeURIComponent(q.value))).json();
    sug.innerHTML = r.suggestions.map((s) => `<li>${esc(s)}</li>`).join('');
    sug.hidden = r.suggestions.length === 0;
  }, 120);
});
sug.addEventListener('click', (e) => { if (e.target.tagName === 'LI') { q.value = e.target.textContent; sug.hidden = true; search(); } });
q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(timer); sug.hidden = true; search(); } });
async function search() {
  const r = await (await fetch('/api/search?q=' + encodeURIComponent(q.value))).json();
  document.getElementById('meta').textContent = `${r.results.length} results shown, run ${r.run}, ${r.ms} ms`;
  const note = document.getElementById('note');
  note.textContent = r.note; note.hidden = !r.note;
  document.getElementById('results').innerHTML = r.results.map((x) =>
    `<li class="r"><div class="t">${esc(x.title)}</div><div class="s">${esc(x.product_id)} · ${esc(x.product_class)} · ${x.price.toFixed(2)} dollars` +
    (x.on_sale ? '<span class="tag">sale</span>' : '') + (x.in_stock ? '' : '<span class="tag out">out of stock</span>') + '</div></li>').join('');
  document.getElementById('facets').innerHTML = Object.entries(r.facets).map(([name, vals]) =>
    `<div class="facet"><h3>${esc(name)}</h3>` + vals.map(([v, n]) => `<div>${esc(v)} (${n})</div>`).join('') + '</div>').join('');
}
</script>
</body>
</html>
