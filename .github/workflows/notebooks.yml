# Runs notebooks from a fresh start, as the notebook standard requires.
# Solution notebooks must run without an error. Learner notebooks stop at
# their unsolved exercises, so they run with --allow-errors: the check is
# that everything up to the exercises works.
#
# Pull requests and pushes to main run only the notebooks that changed, every
# notebook of a course whose data changed, and the notebooks that use another
# changed file (a helper, a recording, case-study data). To run all notebooks,
# start the workflow by hand (Actions, Notebooks, Run workflow).
#
# Notebooks download their files from labs main. Here those downloads come
# from this commit instead (.github/notebook-ci/labs_from_checkout.py), so a
# pull request is tested with its own data, helpers and recordings.
name: Notebooks

on:
  pull_request:
    paths: ["**/*.ipynb", "**/data/**", "**/recordings/**", "*/*.py", "**/*.json", "**/*.jsonl", "**/*.csv", "**/*.csv.gz", "**/*.zip", "**/*.txt", ".github/workflows/notebooks.yml", ".github/notebook-ci/**"]
  push:
    branches: [main]
    paths: ["**/*.ipynb", "**/data/**", "**/recordings/**", "*/*.py", "**/*.json", "**/*.jsonl", "**/*.csv", "**/*.csv.gz", "**/*.zip", "**/*.txt", ".github/workflows/notebooks.yml", ".github/notebook-ci/**"]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install nbconvert ipykernel
      - name: Serve labs downloads from this commit
        run: |
          site=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          printf '%s\nimport labs_from_checkout\n' "$GITHUB_WORKSPACE/.github/notebook-ci" > "$site/labs_from_checkout.pth"
          echo "LABS_CHECKOUT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "LABS_CHECKOUT_MISSES=$RUNNER_TEMP/labs-misses.txt" >> "$GITHUB_ENV"
      - name: Choose the notebooks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT" = workflow_dispatch ]; then
            git ls-files '*.ipynb' > notebooks.txt
          else
            base=${PR_BASE:-$PUSH_BEFORE}
            changed=$(git diff --name-only --diff-filter=d "$base" HEAD)
            {
              echo "$changed" | grep '\.ipynb$' || true
              # A data change can break any notebook of that course.
              for course in $(echo "$changed" | grep -E '^[^/]+/data/' | cut -d/ -f1 | sort -u); do
                git ls-files "$course/*.ipynb"
              done
              # Another changed file (a helper, a recording, case-study data; not an image):
              # the notebooks in its folder (or above its data/ folder), the
              # notebooks of its course that name its path in the course, and
              # every notebook that names its full path.
              echo "$changed" | grep -vE '\.(ipynb|md|png|jpg|jpeg|gif|svg|webp|pdf)$|^\.github/|^[^/]*$' > others.txt || true
              if [ -s others.txt ]; then
                sed -E 's#/[^/]*$##; s#/data$##; s#^#:(glob)#; s#$#/*.ipynb#' others.txt | sort -u | tr '\n' '\0' | xargs -0 git ls-files --
                for course in $(cut -d/ -f1 others.txt | sort -u); do
                  grep "^$course/" others.txt | cut -d/ -f2- > names.txt
                  git grep -l -F -f names.txt -- "$course/*.ipynb" || true
                done
                git grep -l -F -f others.txt -- '*.ipynb' || true
              fi
            } | sort -u > notebooks.txt
          fi
          echo "Notebooks to run: $(wc -l < notebooks.txt)"
          cat notebooks.txt
      - name: Run the notebooks
        run: |
          set -e
          while read -r nb; do
            dir=$(dirname "$nb")
            course=${nb%%/*}
            # Test with the data in this commit. Older notebooks look for their
            # CSV files next to them first. Other downloads from labs main are
            # served from this commit (see "Serve labs downloads").
            # Some data folders have no CSV files.
            for csv in "$course"/data/*.csv; do
              if [ -f "$csv" ]; then cp "$csv" "$dir"/; fi
            done
            echo "::group::$nb"
            case "$nb" in
              *-solution.ipynb) jupyter nbconvert --to notebook --execute --output-dir /tmp/out "$nb" ;;
              *) jupyter nbconvert --to notebook --execute --allow-errors --output-dir /tmp/out "$nb" ;;
            esac
            echo "::endgroup::"
            if [ -s "$LABS_CHECKOUT_MISSES" ]; then
              while read -r url; do
                echo "::warning file=$nb::Downloaded from labs main (not in this commit): $url"
              done < "$LABS_CHECKOUT_MISSES"
              rm "$LABS_CHECKOUT_MISSES"
            fi
          done < notebooks.txt
