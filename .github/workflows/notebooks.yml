# Runs notebooks from a fresh start, as the notebook standard requires.
# Solution notebooks must run without an error. Learner notebooks stop at
# their unsolved exercises, so they run with --allow-errors: the check is
# that everything up to the exercises works.
#
# Pull requests and pushes to main run only the notebooks that changed, and
# every notebook of a course whose data changed. To run all notebooks, start
# the workflow by hand (Actions, Notebooks, Run workflow).
name: Notebooks

on:
  pull_request:
    paths: ["**/*.ipynb", "**/data/**", ".github/workflows/notebooks.yml"]
  push:
    branches: [main]
    paths: ["**/*.ipynb", "**/data/**", ".github/workflows/notebooks.yml"]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install nbconvert ipykernel
      - name: Choose the notebooks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT" = workflow_dispatch ]; then
            git ls-files '*.ipynb' > notebooks.txt
          else
            base=${PR_BASE:-$PUSH_BEFORE}
            changed=$(git diff --name-only --diff-filter=d "$base" HEAD)
            {
              echo "$changed" | grep '\.ipynb$' || true
              # A data change can break any notebook of that course.
              for course in $(echo "$changed" | grep -E '^[^/]+/data/' | cut -d/ -f1 | sort -u); do
                git ls-files "$course/*.ipynb"
              done
            } | sort -u > notebooks.txt
          fi
          echo "Notebooks to run: $(wc -l < notebooks.txt)"
          cat notebooks.txt
      - name: Run the notebooks
        run: |
          set -e
          while read -r nb; do
            dir=$(dirname "$nb")
            course=${nb%%/*}
            # Test with the data in this commit. A notebook downloads its data
            # from main only when the file is not next to it.
            # Some data folders have no CSV files.
            for csv in "$course"/data/*.csv; do
              if [ -f "$csv" ]; then cp "$csv" "$dir"/; fi
            done
            echo "::group::$nb"
            case "$nb" in
              *-solution.ipynb) jupyter nbconvert --to notebook --execute --output-dir /tmp/out "$nb" ;;
              *) jupyter nbconvert --to notebook --execute --allow-errors --output-dir /tmp/out "$nb" ;;
            esac
            echo "::endgroup::"
          done < notebooks.txt
