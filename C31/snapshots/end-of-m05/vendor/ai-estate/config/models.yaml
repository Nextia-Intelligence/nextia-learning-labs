# What the platform knows about each deployment it may map a capability to (owner: Kwame).
# The features are what the earlier courses' real calls showed (the provider simulator applies the same rules).
# Prices: US$ per 1M tokens, the prices of the course's recordings (gemma3:4b: an assumption, see `price_label`).
# Prices change: check your provider's current price page.
models:
  chat-small:
    model_version: gpt-6-luna-2026-09-22
    features: [chat, structured_output, tools]
    needs: {tools: {reasoning_effort: none}}     # tools only with this setting (a real HTTP 400 without it)
    refuses: {}
    price: {input: 0.10, output: 0.50}
    price_label: "price (prices change, check the current price page)"
  chat-strong:
    model_version: gpt-6.1-sol-2026-09-29
    features: [chat, structured_output]           # no function tools in Chat Completions (real HTTP 400s)
    needs: {}
    refuses: {reasoning_effort: [none]}           # a real HTTP 400: "does not support 'none' with this model"
    price: {input: 2.00, output: 10.00}
    price_label: "price (prices change, check the current price page)"
  embed-small:
    model_version: text-embedding-3-small
    features: [embeddings]
    needs: {}
    refuses: {}
    dimensions: 384
    price: {input: 0.02, output: 0.0}
    price_label: "price (prices change, check the current price page)"
  gemma3:4b:
    model_version: gemma3:4b
    features: [chat, structured_output]           # no tool calling (a real HTTP 400 from Ollama)
    needs: {}
    refuses: {}
    price: {input: 0.0, output: 0.0}
    price_label: "assumption: US$0 per token on Larkfield's own hardware; the hardware and power are not counted"
