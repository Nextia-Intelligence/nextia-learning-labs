# Alert rules of the support workflow (Grafana file provisioning). The same rules, for saved telemetry,
# are in rules.json (python -m obs alerts). Windows: 90 s = one practice day of the compressed week.
apiVersion: 1
groups:
  - orgId: 1
    name: "Support workflow"
    folder: "Support workflow"
    interval: "10s"
    rules:
      - uid: "unreconciled-writes"
        title: "A write timed out and nobody checked whether it happened"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(larkfield_writes_total{larkfield_write_outcome=\"timeout\"}[90s])) - sum(increase(larkfield_reconciles_total[90s]))"
              instant: true
              range: false
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "SEV-1"
          owner: "Amira"
          service: "support-workflow"
        annotations:
          summary: "A write timed out and nobody checked whether it happened"
          first_step: "Run `python -m obs find duplicate_write` (or the TraceQL query `duplicate write` in grafana/traceql.md), then ask the payment system for each operation ID before anyone sends the change again."
        isPaused: false
      - uid: "reply-failures"
        title: "Replies to customers failed"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(larkfield_tool_calls_total{gen_ai_tool_name=\"send_reply\",larkfield_tool_status=\"failed\"}[90s]))"
              instant: true
              range: false
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "SEV-2"
          owner: "Grace"
          service: "support-workflow"
        annotations:
          summary: "Replies to customers failed"
          first_step: "Open the runs with `larkfield.reply.status = failed`; check that each ticket went to a person, not to resolved."
        isPaused: false
      - uid: "loop-stops"
        title: "Runs stopped by a loop limit"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(larkfield_run_stops_total{larkfield_stop_reason=~\"repeated_call|max_steps|too_many_errors\"}[90s]))"
              instant: true
              range: false
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 2.999999999
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "SEV-3"
          owner: "Amira"
          service: "support-workflow"
        annotations:
          summary: "Runs stopped by a loop limit"
          first_step: "Open three stopped runs (`python -m obs find loop`): which model, which step repeats? Compare with the last release."
        isPaused: false
      - uid: "cost-per-resolved"
        title: "Cost per resolved ticket over budget"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(larkfield_run_cost_total[90s])) / sum(increase(larkfield_runs_total{larkfield_outcome=\"resolved\"}[90s]))"
              instant: true
              range: false
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.002
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "SEV-3"
          owner: "Kwame"
          service: "support-workflow"
        annotations:
          summary: "Cost per resolved ticket over budget"
          first_step: "Split the cost by model and slice (`python -m obs cost --by model`, the Cost panels): which change raised it? The budget (US$0.002 per resolved ticket) is an assumption: Omar's."
        isPaused: false
      - uid: "handoff-rate"
        title: "Too many tickets handed to a person"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              expr: "sum(increase(larkfield_runs_total{larkfield_outcome=\"handed_to_person\"}[90s])) / sum(increase(larkfield_runs_total[90s]))"
              instant: true
              range: false
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.45
        noDataState: "OK"
        execErrState: "Error"
        for: "0s"
        labels:
          severity: "SEV-3"
          owner: "Grace"
          service: "support-workflow"
        annotations:
          summary: "Too many tickets handed to a person"
          first_step: "Group the handed-over runs by model and stop reason (`python -m obs runs --outcome handed_to_person`)."
        isPaused: false
