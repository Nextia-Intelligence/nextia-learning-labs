# Grafana for the support workflow: one container (grafana/otel-lgtm: an OpenTelemetry Collector, Tempo,
# Prometheus, Loki and Grafana). Optional: every lesson also works from saved telemetry with python -m obs.
#
#   docker compose -f grafana/compose.yaml up -d          (from the project folder)
#   Grafana: http://127.0.0.1:3031   OTLP: http://127.0.0.1:4318   Tempo API: http://127.0.0.1:3200
#   docker compose -f grafana/compose.yaml down -v        (stop it and delete its data)
#
# The Collector inside uses the course's configuration (../collector/otelcol-config.yaml): redaction, tail
# sampling for traces, and audit events routed to the audit store on your computer
# (python -m auditstore serve --host 0.0.0.0), which the container reaches at host.docker.internal.
# For Langfuse, set OTELCOL_CONFIG=otelcol-config-langfuse.yaml and the three LANGFUSE_ variables in your shell.
name: support-observability
services:
  lgtm:
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    ports:
      - "127.0.0.1:3031:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9090:9090"
    environment:
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer        # people who are not signed in can look, not change
      AUDIT_STORE_URL: http://host.docker.internal:8313
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lgtmdata:/data
      - ./provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/support-workflow.yaml:ro
      - ./dashboards:/otel-lgtm/support-workflow-dashboards:ro

volumes:
  lgtmdata:
