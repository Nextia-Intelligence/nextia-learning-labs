[project]
name = "forecast-job"
version = "1.0.0"
description = "Larkfield's weekly forecasting job: data checks, forecasts with a range, the stock order and the help-desk roster."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
