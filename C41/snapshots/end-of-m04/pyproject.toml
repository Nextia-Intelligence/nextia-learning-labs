[project]
name = "larkspeech"
version = "1.0.0"
description = "Larkfield's speech tools: measure transcripts, compare speech methods on the same calls, and run the Larkfield IVR."
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
speech = "larkspeech.cli:main"

[tool.setuptools.packages.find]
include = ["larkspeech*"]

[tool.setuptools.package-data]
"larkspeech.ivr" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "B905"]
